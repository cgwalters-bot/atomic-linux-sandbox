# Key-only SSH: sshd is enabled and reachable, so refuse password guessing.
# Root keeps key login, which bcvk and to-existing-root installs inject.
# sshd keeps the first value it reads and includes these files in order,
# so this one wins over Fedora's 50-redhat.conf; a derived image overrides
# it with a lower-numbered file.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
