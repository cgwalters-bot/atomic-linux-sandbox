# Keep runaway jobs from exhausting the host: percentages are of physical
# RAM, so the cap scales with the machine. MemoryHigh throttles and reclaims
# before MemoryMax invokes the OOM killer inside the slice, so sshd and the
# other host services are not the ones killed. CPUWeight, half the default,
# lowers the slice's share only under contention.
[Slice]
MemoryHigh=75%
MemoryMax=85%
CPUWeight=50
